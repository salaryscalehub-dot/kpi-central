<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>KPI Central | لوحة مؤشرات الأداء</title>
  <link rel="icon" href="/assets/brand/kpi-central-logo-email.png">
  <style>
    html, body { margin: 0; height: 100%; background: #f3f6fa; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <!-- لوحة KPI Central تُعرض داخل هذه الصفحة على kpi-central.com (وليس بالانتقال إلى script.google.com)،
       لأن Google يرفض فتح التطبيق مباشرة لمن يسجّل الدخول بأكثر من حساب في المتصفح.
       تفاصيل الرابط (تفعيل، تعيين كلمة مرور، تذكير...) تُمرَّر إلى التطبيق كما هي.
       credentialless: يُحمَّل الإطار دون بيانات حساب Google في المتصفح (مثل النافذة الخاصة)،
       فلا يحاول Google فتحه باسم حساب شخصي من خارج النطاق. -->
  <iframe id="app" title="KPI Central" credentialless allow="fullscreen; clipboard-write" allowfullscreen></iframe>
  <script>
    (function () {
      var base = 'https://script.google.com/macros/s/AKfycbyxZiMU3TaW2Gg86zrYHybpcK_OrayYRM-3QE0GKMV9HFswVb5t-82bpCFcA-SGLvRV/exec';
      var query = window.location.search && window.location.search.length > 1 ? window.location.search : '?login=1';
      document.getElementById('app').src = base + query;
    })();
  </script>
  <noscript><p style="text-align:center;font-family:Tahoma,sans-serif;margin-top:40px">يتطلب تشغيل لوحة KPI Central تفعيل JavaScript في المتصفح.</p></noscript>
</body>
</html>
