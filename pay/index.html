<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f55">
  <meta name="robots" content="noindex">
  <title>الاشتراك والدفع | KPI Central</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#102f55;--navy-deep:#0b223b;--gold:#c69a4a;--gold-light:#dfba72;--cream:#f7f3ec;--paper:#fffdf9;--text:#26384f;--muted:#6b7480;--border:#e6ded2;--green:#347d4b;--red:#a43434;--shadow:0 22px 52px -34px rgba(16,47,85,.32)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:linear-gradient(180deg,#fbfaf7 0%,var(--cream) 100%);color:var(--text);font-family:'Noto Sans Arabic',Calibri,sans-serif;font-size:14px;line-height:1.8}
    .wrap{width:min(1060px,calc(100% - 32px));margin:auto}.top{background:linear-gradient(120deg,var(--navy),var(--navy-deep));color:#fff}.top-inner{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{font-weight:900;font-size:19px;color:#fff;text-decoration:none}.brand span{color:var(--gold-light)}.back{color:#fff;text-decoration:none;font-size:12px;font-weight:700;border:1px solid #ffffff55;border-radius:9px;padding:8px 12px}
    .intro{padding:34px 0 20px}.eyebrow{color:#a27b3d;font-size:11px;font-weight:900}.intro h1{font-size:clamp(24px,3vw,34px);line-height:1.35;color:var(--navy);margin:7px 0 8px}.intro p{margin:0;color:var(--muted)}
    .card{background:var(--paper);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:24px;margin:0 0 22px}
    .section-title{color:var(--navy);font-size:16px;margin:0 0 14px;font-weight:900}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.summary div{background:#f8f5ef;border-radius:12px;padding:12px 14px}.summary small{display:block;color:var(--muted);font-size:11px}.summary b{color:var(--navy);font-size:15px}
    .badge{display:inline-block;font-size:11px;font-weight:900;padding:2px 10px;border-radius:20px}.badge.ok{background:#edf7ee;color:var(--green)}.badge.warn{background:#fdf3e1;color:#9a6b1d}.badge.bad{background:#fff0ee;color:var(--red)}
    .plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}.plan{position:relative;display:block;padding:15px;border:1px solid var(--border);border-radius:12px;background:#fff;cursor:pointer}
    .plan:has(input:checked){border-color:var(--gold);box-shadow:0 0 0 2px #c69a4a22;background:#fffdf8}.plan input{position:absolute;top:17px;left:16px;accent-color:var(--navy);width:17px;height:17px}.plan strong{display:block;padding-left:25px;color:var(--navy)}.price{display:block;margin-top:6px;color:#8a6934;font-weight:900;font-size:12px}
    .billing{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:0 0 4px;padding:14px;background:#f8f5ef;border-radius:12px}.billing label{display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:800;font-size:12px}.billing input{accent-color:var(--navy)}
    .amount{margin-right:auto;color:var(--navy);font-size:18px;font-weight:900}.save{color:var(--green);font-size:11px;font-weight:800}
    .bank{display:grid;gap:10px}.bank-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px dashed #d9cdb6;border-radius:12px;background:#fff}.bank-row small{display:block;color:var(--muted);font-size:11px}.bank-row b{color:var(--navy);word-break:break-all}
    .copy{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:11px;font-weight:800;color:var(--navy);cursor:pointer;white-space:nowrap}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 16px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#34465b}
    .field input{width:100%;min-height:44px;border:1px solid #ddd8ce;border-radius:9px;background:#fff;padding:10px 12px;color:var(--text);font:inherit;font-size:13px;outline:none}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c69a4a20}
    .hint{font-weight:400;color:var(--muted);font-size:11px}
    .submit{width:100%;min-height:48px;border:0;border-radius:10px;background:linear-gradient(135deg,#dfba72,#c4913c);color:var(--navy);font:inherit;font-weight:900;font-size:14px;cursor:pointer;margin-top:18px}.submit:disabled{opacity:.7;cursor:wait}
    .status{display:none;margin-top:16px;padding:15px;border-radius:10px;font-size:13px}.status.show{display:block}.status.success{background:#edf7ee;border:1px solid #b9d9bd;color:#255f31}.status.error{background:#fff0ee;border:1px solid #ecc7c3;color:#8d2929}
    .center{text-align:center;padding:60px 20px;color:var(--muted)}.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .done{text-align:center;padding:34px 20px}.done h2{color:var(--navy);margin:8px 0}.done .icon{font-size:40px}
    .smallprint{text-align:center;color:var(--muted);font-size:10px;padding:0 0 26px}
    @media(max-width:760px){.summary{grid-template-columns:1fr}.plans{grid-template-columns:1fr}.card{padding:17px}}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.amount{width:100%;margin-right:0}.bank-row{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap top-inner"><a class="brand" href="/">KPI <span>Central</span></a><a class="back" href="/login">دخول العملاء</a></div></header>
  <main class="wrap">
    <section class="intro"><span class="eyebrow">الاشتراك والدفع</span><h1 id="title">اشتراك منشأتك</h1><p id="subtitle">حوّل قيمة الاشتراك إلى حسابنا البنكي، ثم أرسل لنا بيانات التحويل لتفعيل اشتراكك.</p></section>
    <div id="app"><div class="card center"><div class="spinner"></div>جارٍ تحميل بيانات اشتراكك…</div></div>
    <p class="smallprint">الأسعار شاملة ضريبة القيمة المضافة · KPI Central</p>
  </main>
  <script>
    (()=>{
      const endpoint='https://script.google.com/macros/s/AKfycbyOEVPOYOyl1zUlV7TStHXjIBNMS6PHxvSW2g2rRQJ5C5c8RHu7aWZhDQ7ilnthKc3T/exec';
      const params=new URLSearchParams(location.search),t=params.get('t')||'',k=params.get('k')||'';
      const app=document.getElementById('app');
      const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const money=n=>Number(n).toLocaleString('en-US');
      const date=t=>t?new Date(t).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'}):'—';
      const STATUS={trialing:['فترة تجريبية','warn'],active:['اشتراك فعّال','ok'],trial_expired:['انتهت التجربة','bad'],expired:['منتهٍ','bad'],suspended:['موقوف','bad'],cancelled:['ملغى','bad']};
      const call=async payload=>{
        const res=await fetch(endpoint,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({t,k},payload))});
        const data=JSON.parse(await res.text());
        if(!data.ok)throw new Error(data.error||'تعذر إكمال الطلب.');
        return data;
      };
      const fail=msg=>{app.innerHTML='<div class="card center">'+esc(msg)+'<div style="margin-top:12px">للمساعدة تواصل معنا عبر <a href="/#contact">صفحة التواصل</a>.</div></div>'};
      if(!t||!k){fail('رابط الدفع غير مكتمل. استخدم الرابط الذي وصلك بالبريد.');return}

      call({form:'pay_info'}).then(({info})=>render(info)).catch(e=>fail(e.message));

      function render(info){
        document.getElementById('title').textContent='اشتراك '+info.orgName;
        const st=STATUS[info.status]||[info.status,'warn'];
        let html='<div class="card"><div class="summary">'+
          '<div><small>المنشأة</small><b>'+esc(info.orgName)+'</b></div>'+
          '<div><small>الحالة</small><span class="badge '+st[1]+'">'+esc(st[0])+'</span></div>'+
          '<div><small>'+(info.status==='active'||info.status==='trialing'?'صالح حتى':'انتهى في')+'</small><b>'+date(info.accessUntil)+'</b></div></div></div>';
        if(info.pending){
          app.innerHTML=html+'<div class="card done"><div class="icon">⏳</div><h2>تحويلك قيد المراجعة</h2><p>استلمنا بيانات تحويلك، وسنراجعها ونبلغك بالبريد خلال يوم عمل.</p></div>';return;
        }
        if(!info.plans.length){
          app.innerHTML=html+'<div class="card center">سعر باقتك مخصص. تواصل معنا لإتمام الاشتراك عبر <a href="/#contact">صفحة التواصل</a>.</div>';return;
        }
        const current=info.plans.some(p=>p.code===info.planCode)?info.planCode:info.plans[0].code;
        html+='<form class="card" id="pay-form" novalidate><h2 class="section-title">1. اختر الباقة والفترة</h2><div class="plans">'+
          info.plans.map(p=>'<label class="plan"><input type="radio" name="plan_code" value="'+esc(p.code)+'"'+(p.code===current?' checked':'')+'><strong>'+esc(p.name)+(p.code===info.planCode?' <span class="hint">(باقتك الحالية)</span>':'')+'</strong><span class="price">'+money(p.monthly)+' ريال شهرياً · '+money(p.annual)+' ريال سنوياً</span></label>').join('')+
          '</div><div class="billing"><label><input type="radio" name="billing_interval" value="monthly"'+(info.interval!=='annual'?' checked':'')+'> شهري</label><label><input type="radio" name="billing_interval" value="annual"'+(info.interval==='annual'?' checked':'')+'> سنوي</label><span class="save" id="save"></span><output class="amount" id="amount"></output></div>'+
          '<h2 class="section-title" style="margin-top:24px">2. حوّل المبلغ إلى حسابنا</h2><div class="bank">'+
          bankRow('اسم البنك',info.bank.name,false)+bankRow('اسم صاحب الحساب',info.bank.accountName,false)+bankRow('رقم الآيبان',info.bank.iban,true)+'</div>'+
          '<h2 class="section-title" style="margin-top:24px">3. أرسل بيانات التحويل</h2><div class="grid">'+
          '<div class="field"><label for="payer">اسم صاحب الحساب المحوِّل *</label><input id="payer" name="payer_name" required maxlength="120"></div>'+
          '<div class="field"><label for="ref">رقم مرجع التحويل</label><input id="ref" name="reference" maxlength="80" dir="ltr"></div>'+
          '<div class="field"><label for="date">تاريخ التحويل *</label><input id="date" name="transfer_date" type="date" required></div>'+
          '<div class="field"><label for="receipt">صورة الإيصال <span class="hint">(صورة أو PDF، حتى 5 ميجابايت)</span></label><input id="receipt" name="receipt" type="file" accept="image/*,application/pdf"></div>'+
          '<div class="field full"><span class="hint">أدخل رقم المرجع أو أرفق الإيصال، أو كليهما لتسريع المراجعة.</span></div></div>'+
          '<button class="submit" id="submit" type="submit">إرسال بيانات التحويل</button><div class="status" id="status" role="status"></div></form>';
        app.innerHTML=html;
        const form=document.getElementById('pay-form'),amountEl=document.getElementById('amount'),saveEl=document.getElementById('save'),status=document.getElementById('status'),button=document.getElementById('submit');
        form.elements.transfer_date.value=new Date().toISOString().slice(0,10);
        const selected=()=>info.plans.find(p=>p.code===form.elements.plan_code.value);
        const update=()=>{const p=selected(),annual=form.elements.billing_interval.value==='annual';amountEl.textContent=money(annual?p.annual:p.monthly)+' ريال';saveEl.textContent=annual&&p.monthly*12>p.annual?'توفّر '+money(p.monthly*12-p.annual)+' ريال':''};
        form.addEventListener('change',e=>{if(e.target.name==='plan_code'||e.target.name==='billing_interval')update()});update();
        document.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy);b.textContent='تم النسخ';setTimeout(()=>b.textContent='نسخ',1500)}));
        const show=(kind,msg)=>{status.className='status show '+kind;status.innerHTML=msg};
        form.addEventListener('submit',async e=>{
          e.preventDefault();status.className='status';
          const file=form.elements.receipt.files[0];
          if(!form.elements.payer_name.value.trim()){show('error','أدخل اسم صاحب الحساب المحوِّل.');return}
          if(!form.elements.reference.value.trim()&&!file){show('error','أدخل رقم مرجع التحويل أو أرفق صورة الإيصال.');return}
          if(file&&file.size>5*1024*1024){show('error','حجم الإيصال أكبر من 5 ميجابايت.');return}
          button.disabled=true;button.textContent='جارٍ الإرسال…';
          try{
            const receipt=file?{name:file.name,type:file.type||'application/octet-stream',data:await toBase64(file)}:null;
            await call({form:'pay_submit',plan_code:form.elements.plan_code.value,billing_interval:form.elements.billing_interval.value,
              payer_name:form.elements.payer_name.value,reference:form.elements.reference.value,transfer_date:form.elements.transfer_date.value,receipt});
            form.outerHTML='<div class="card done"><div class="icon">✅</div><h2>استلمنا بيانات تحويلك</h2><p>سنراجعها خلال يوم عمل، ويصلك بريد فور تفعيل الاشتراك.</p></div>';
          }catch(err){show('error',esc(err.message||'تعذر الإرسال. حاول مرة أخرى.'))}
          finally{if(document.body.contains(button)){button.disabled=false;button.textContent='إرسال بيانات التحويل'}}
        });
      }
      function bankRow(label,value,copy){return '<div class="bank-row"><div><small>'+label+'</small><b'+(copy?' dir="ltr"':'')+'>'+esc(value)+'</b></div>'+(copy?'<button type="button" class="copy" data-copy="'+esc(String(value).replace(/\s/g,''))+'">نسخ</button>':'')+'</div>'}
      function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})}
    })();
  </script>
</body>
</html>
